<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><style>.stn{fill:#fff;stroke-width:3.5}.lbl{font:12.5px "SFMono-Regular",Menlo,monospace;fill:#15181d}.lblm{font:12px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#6a7180}.lname{font:600 15px "Helvetica Neue",Helvetica,Arial,sans-serif}.ttl{font:600 27px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#15181d}.sub{font:14.5px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#6a7180}.cap{font:13px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#6a7180}.capb{font:600 13px "Helvetica Neue",Helvetica,Arial,sans-serif;fill:#15181d}</style><rect width="1200" height="1000" fill="#faf9f7"/><text class="ttl" x="48" y="54">The 727 arc network</text><text class="sub" x="48" y="82">Every known six-cube configuration reaching 727 · line lengths TO SCALE in rotation angle · station spacing even</text><line x1="700" y1="126" x2="700" y2="600" stroke="#9aa0ab" stroke-width="2" stroke-dasharray="7 6"/><text class="lblm" x="700" y="116" text-anchor="middle">W4 wall — the free cube's face plane through the base triple point (1, 7/11, −1/11)</text><text class="lblm" x="700" y="622" text-anchor="middle">the only wall crossed by all three arcs · lines are positioned so it is straight</text><path d="M 536 180 H 776" stroke="#c2553a" stroke-width="7" fill="none" stroke-linecap="round"/><g stroke="#c2553a"><circle class="stn" cx="536" cy="180" r="7"/><circle class="stn" cx="584" cy="180" r="6"/><circle class="stn" cx="632" cy="180" r="6"/><circle class="stn" cx="680" cy="180" r="6"/><circle class="stn" cx="728" cy="180" r="6"/><circle class="stn" cx="776" cy="180" r="7"/></g><text class="lname" x="536" y="140" fill="#c2553a">A</text><text class="lblm" x="558" y="140">4 fields · 10 chambers · extent 3.99° of rotation</text><text class="lblm" x="536" y="162" text-anchor="middle">2.0640</text><text class="lblm" x="776" y="162" text-anchor="middle">19/6</text><text class="lblm" x="536" y="232" text-anchor="middle">723 ↓</text><text class="lblm" x="802" y="185">723 ↓</text><text class="lbl" x="584" y="206" text-anchor="middle">√1093</text><text class="lbl" x="632" y="206" text-anchor="middle">√13</text><text class="lbl" x="680" y="206" text-anchor="middle">√403</text><text class="lbl" x="728" y="206" text-anchor="middle">√2741</text><path d="M 273 360 H 779" stroke="#4a6fb0" stroke-width="7" fill="none" stroke-linecap="round"/><g stroke="#4a6fb0"><circle class="stn" cx="273" cy="360" r="7"/><circle class="stn" cx="329" cy="360" r="6"/><circle class="stn" cx="385" cy="360" r="6"/><circle class="stn" cx="441" cy="360" r="6"/><circle class="stn" cx="498" cy="360" r="6"/><circle class="stn" cx="554" cy="360" r="6"/><circle class="stn" cx="610" cy="360" r="6"/><circle class="stn" cx="666" cy="360" r="6"/><circle class="stn" cx="722" cy="360" r="6"/><circle class="stn" cx="779" cy="360" r="7"/></g><text class="lname" x="273" y="320" fill="#4a6fb0">C</text><text class="lblm" x="295" y="320">8 fields · 12 chambers · extent 8.43° of rotation</text><text class="lblm" x="273" y="342" text-anchor="middle">1.1675</text><text class="lblm" x="779" y="342" text-anchor="middle">47.7721</text><text class="lblm" x="273" y="412" text-anchor="middle">723 ↓</text><text class="lblm" x="805" y="365">723 ↓</text><text class="lbl" x="329" y="386" text-anchor="middle">√13461</text><text class="lbl" x="385" y="386" text-anchor="middle">√13489</text><text class="lbl" x="441" y="386" text-anchor="middle">√5305</text><text class="lbl" x="498" y="386" text-anchor="middle">√226</text><text class="lbl" x="554" y="386" text-anchor="middle">√27349</text><text class="lbl" x="610" y="386" text-anchor="middle">√3459</text><text class="lbl" x="666" y="386" text-anchor="middle">√1785</text><text class="lbl" x="722" y="386" text-anchor="middle">√1930</text><path d="M 358 540 H 780" stroke="#3f7f8f" stroke-width="7" fill="none" stroke-linecap="round"/><g stroke="#3f7f8f"><circle class="stn" cx="358" cy="540" r="7"/><circle class="stn" cx="463" cy="540" r="6"/><circle class="stn" cx="569" cy="540" r="6"/><circle class="stn" cx="675" cy="540" r="6"/><circle class="stn" cx="780" cy="540" r="7"/></g><text class="lname" x="358" y="500" fill="#3f7f8f">B</text><text class="lblm" x="380" y="500">3 fields · 11 chambers · extent 7.04° of rotation</text><text class="lblm" x="358" y="522" text-anchor="middle">43/105</text><text class="lblm" x="780" y="522" text-anchor="middle">0.5794</text><text class="lblm" x="358" y="592" text-anchor="middle">723 ↓</text><text class="lblm" x="806" y="545">723 ↓</text><text class="lbl" x="463" y="566" text-anchor="middle">√25561</text><text class="lbl" x="569" y="566" text-anchor="middle">√12313</text><text class="lbl" x="675" y="566" text-anchor="middle">√1614</text><path d="M 700 700 L 900 802" stroke="#8a5aa8" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M 705 804 L 902 698" stroke="#8a5aa8" stroke-width="7" fill="none" stroke-linecap="round" opacity=".72"/><g stroke="#8a5aa8"><circle class="stn" cx="700" cy="700" r="6"/><circle class="stn" cx="900" cy="802" r="6"/><circle class="stn" cx="705" cy="804" r="6"/><circle class="stn" cx="902" cy="698" r="6"/></g><circle cx="801" cy="751" r="12" fill="#fff" stroke="#8a5aa8" stroke-width="4.5"/><text class="lname" x="700" y="662" fill="#8a5aa8">D</text><text class="lblm" x="722" y="662">two arcs crossing at the record — extents 5.91° and 7.31°, really 4.51° apart</text><text class="lblm" x="662" y="694">D1</text><text class="lblm" x="662" y="816">D2</text><line x1="815" y1="751" x2="922" y2="744" stroke="#9aa0ab" stroke-width="1.2"/><text class="lbl" x="930" y="747">the n = 6 record (7,14,1,−5)</text><text class="lblm" x="930" y="767">interchange: D1 ↔ D2</text><circle cx="70" cy="700" r="7" fill="none" stroke="#9aa0ab" stroke-width="2.5"/><text class="lblm" x="92" y="696">The carriers of C and D1 meet exactly — but at s = −6.84 on C and t = 0.391 on D1,</text><text class="lblm" x="92" y="714">outside BOTH 727 ranges, where the count is 725. The lines connect; the arcs do not.</text><text class="lblm" x="70" y="770">KEY</text><circle class="stn" cx="90" cy="798" r="7" stroke="#15181d"/><text class="lblm" x="112" y="802">terminus — the count steps down to 723 beyond it</text><circle class="stn" cx="90" cy="826" r="6" stroke="#15181d"/><text class="lblm" x="112" y="830">a congruence class living in ℚ(√d) — the label is d</text><circle cx="90" cy="854" r="11" fill="#fff" stroke="#15181d" stroke-width="4"/><text class="lblm" x="112" y="858">interchange — two arcs genuinely meet</text><circle cx="90" cy="882" r="7" fill="none" stroke="#9aa0ab" stroke-width="2.5"/><text class="lblm" x="112" y="886">carriers cross, arcs do not — no interchange</text><text class="capb" x="48" y="920">TO SCALE</text><text class="cap" x="140" y="920">line length is the arc's true extent as ROTATION ANGLE (60 px per degree). Cayley-coordinate length would span 520× and is meaningless — the chart diverges as θ→180°.</text><text class="capb" x="48" y="946">NOT TO SCALE</text><text class="cap" x="168" y="946">station spacing within a line is even, not proportional to parameter · the D1/D2 crossing angle is 4.51°, drawn wide · each arc has 72 chart copies, one shown.</text><text class="cap" x="168" y="968">The VERTICAL AXIS CARRIES NOTHING — row order and spacing are for legibility only. Only the dashed wall's vertical is meaningful.</text></svg>