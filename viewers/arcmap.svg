<text class="lblm" x="346.1" y="487.9" text-anchor="end">−0.1358 · 723 ↓</text>
<text class="lblm" x="853.9" y="340.1">0.2207 · 723 ↓</text>
<circle cx="600" cy="410" r="15" fill="#fff" stroke="#7a4fa0" stroke-width="4"/>
<text class="lname" x="428.3" y="330.6" fill="#3d7e87">D1 = B</text>
<text class="lblm" x="428.3" y="346.6">3 fields · 11 chambers · 7.04°</text>
<text class="lname" x="348.1" y="543.9" fill="#4b6fb0">D2 = C</text>
<text class="lblm" x="348.1" y="559.9">8 fields · 12 chambers · 8.43°</text>
<line x1="612" y1="420" x2="750" y2="560" stroke="#6a7180" stroke-width="1.2"/>
<text class="lbl" x="756" y="566">the n = 6 record (7,14,1,−5)</text>
<text class="lblm" x="756" y="584">a node: the two branches cross here, really 4.51° apart</text>
<text class="capb" x="48" y="660">KEY</text>
<circle class="stn" cx="60" cy="684" r="7" stroke="#15181d"/>
<text class="cap" x="80" y="688">terminus: the count steps down to 723 beyond it</text>
<circle class="stn" cx="60" cy="710" r="6" stroke="#15181d"/>
<text class="cap" x="80" y="714">a congruence class living in ℚ(√d), labelled by d</text>
<circle cx="60" cy="738" r="10" fill="#fff" stroke="#7a4fa0" stroke-width="4"/>
<text class="cap" x="80" y="742">the record: where the two branches of the node cross</text>
<line x1="60" y1="756" x2="60" y2="776" stroke="#9aa0ab" stroke-width="2.5" stroke-dasharray="4 3"/>
<text class="cap" x="80" y="770">where each arc crosses the one W4 wall they all cross: a free-cube face plane through a base triple point</text>
<text class="capb" x="48" y="810">TO SCALE</text>
<text class="cap" x="200" y="810">line length is rotation angle over the SOLVED extent, 60 px per degree. D1 = B and D2 = C agree exactly (P392).</text>
<text class="capb" x="48" y="836">NOT TO SCALE</text>
<text class="cap" x="200" y="836">station spacing is even, not proportional (the ORDER is true); the D1/D2 crossing is 4.51°, drawn wide.</text>
<text class="capb" x="48" y="862">UP TO CONGRUENCE</text>
<text class="cap" x="200" y="862">the fixed-base drawing (arcmap_fixed_base.svg) shows five lines; B and C there are D1 and D2 here (P391).</text>
<text class="cap" x="200" y="888">The vertical axis carries nothing: row order and spacing are for legibility only.</text>
</svg>