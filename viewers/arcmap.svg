<text class="ttl" x="48" y="54">The 727 arc network</text>
<text class="sub" x="48" y="82">Every known six-cube configuration reaching 727, UP TO CONGRUENCE: three arcs, two of them crossing at the record · lengths TO SCALE in rotation angle</text>
