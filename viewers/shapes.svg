<text class="v" x="260" y="358" text-anchor="middle">0 — isolated</text>
<text class="k" x="260" y="371" text-anchor="middle">components</text>
<text class="v" x="260" y="385" text-anchor="middle">exactly 2</text>
<text class="k" x="260" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="260" y="412" text-anchor="middle">O and D₃</text>
<text class="k" x="260" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="260" y="439" text-anchor="middle">both irrational</text>
<text class="k" x="260" y="452" text-anchor="middle">drops to</text>
