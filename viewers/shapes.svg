<ellipse cx="880" cy="235" rx="30" ry="17" fill="#4a6fb0" opacity=".22"/>
<ellipse cx="880" cy="235" rx="30" ry="17" fill="none" stroke="#4a6fb0" stroke-width="2"/>
<text class="k" x="880" y="239" text-anchor="middle" style="fill:#4a6fb0">2-dim</text>
<line x1="816" y1="320" x2="944" y2="320" stroke="#dcd9d3" stroke-width="1"/>
<text class="k" x="880" y="344" text-anchor="middle">dimension</text>
<text class="v" x="880" y="358" text-anchor="middle">2 — two sheets cross</text>
<text class="k" x="880" y="371" text-anchor="middle">components</text>
<text class="v" x="880" y="385" text-anchor="middle">≥1</text>
<text class="k" x="880" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="880" y="412" text-anchor="middle">trivial</text>
<text class="k" x="880" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="880" y="439" text-anchor="middle">rational (D1 sheet)</text>
<text class="k" x="880" y="452" text-anchor="middle">drops to</text>
<text class="v" x="880" y="466" text-anchor="middle">1215</text>

<!-- n = 8 : 3-dimensional, a 38-vertex polytope (P383, P385) -->
<text class="n" x="1035" y="118" text-anchor="middle">n = 8</text>
<text class="max" x="1035" y="152" text-anchor="middle">1895</text>
<line x1="958" y1="104" x2="958" y2="480" stroke="#dcd9d3" stroke-width="1"/>
<ellipse cx="1035" cy="235" rx="40" ry="20" fill="#4a6fb0" opacity=".22"/>
<ellipse cx="1035" cy="235" rx="40" ry="20" fill="none" stroke="#4a6fb0" stroke-width="2"/>
<text class="k" x="1035" y="239" text-anchor="middle" style="fill:#4a6fb0">3-dim</text>
<line x1="971" y1="320" x2="1099" y2="320" stroke="#dcd9d3" stroke-width="1"/>
<text class="k" x="1035" y="344" text-anchor="middle">dimension</text>
<text class="v" x="1035" y="358" text-anchor="middle">3 — a polytope</text>
<text class="k" x="1035" y="371" text-anchor="middle">components</text>
<text class="v" x="1035" y="385" text-anchor="middle">≥1</text>
<text class="k" x="1035" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="1035" y="412" text-anchor="middle">trivial</text>
<text class="k" x="1035" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="1035" y="439" text-anchor="middle">rational</text>
<text class="k" x="1035" y="452" text-anchor="middle">drops to</text>
<text class="v" x="1035" y="466" text-anchor="middle">1893</text>

<line x1="40" y1="514" x2="1140" y2="514" stroke="#dcd9d3" stroke-width="1"/>
<text class="capb" x="40" y="540">THE MARK IS THE DIMENSION — A DASHED MARK MEANS IT IS NOT YET MEASURED, A TICK MEANS THE END IS IN THE SET</text>
<circle cx="48" cy="565" r="7" fill="#15181d"/>
<text class="lg" x="64" y="569">0-dimensional, argued</text>
<circle cx="232" cy="565" r="7" fill="#faf9f7" stroke="#15181d" stroke-width="2.5" stroke-dasharray="3 2.5"/>
<text class="lg" x="248" y="569">not yet measured</text>
<line x1="404" y1="565" x2="434" y2="565" stroke="#c2553a" stroke-width="4"/>
<text class="lg" x="442" y="569">a continuum</text>
<path d="M 546.4 571.4 A 9 9 0 1 1 546.4 558.6" fill="none" stroke="#c2553a" stroke-width="4"/>
<circle cx="548.5" cy="565" r="3" fill="#faf9f7" stroke="#6a7180" stroke-width="2"/>
<text class="lg" x="558" y="569">one that wraps</text>
<ellipse cx="678" cy="565" rx="15" ry="9" fill="#4a6fb0" opacity=".22"/>
<ellipse cx="678" cy="565" rx="15" ry="9" fill="none" stroke="#4a6fb0" stroke-width="2"/>
<text class="lg" x="700" y="569">2+ dimensions</text>
<line x1="812" y1="565" x2="842" y2="565" stroke="#c2553a" stroke-width="4"/>
<line x1="842" y1="558" x2="842" y2="572" stroke="#c2553a" stroke-width="3"/>
<text class="lg" x="850" y="569">its end is in the set</text>
<text class="cap" x="40" y="596">Dimension is measured in CLASS space; the 3 gauge dimensions of rotating a whole compound are quotiented out and never counted. "Drops to" is the best</text>
<text class="cap" x="40" y="616">count among 290 primitive Cayley directions at ε = 1/64, so the gap is readable by subtraction: 4, 8, 10, 2, 4, 2, 2 — and the neighbourhood is NOT one</text>
<text class="cap" x="40" y="634">value but 4, 6, 14, 14, 22 and 32 distinct counts as n runs 2 to 8. No direction preserves the count except along a tangent: every maximiser lies on walls.</text>
<text class="cap" x="40" y="658">n = 2 is drawn in class space: ONE arc, open at the identity, along body-diagonal rotations to 60°, where it meets the edge family, and on to a closed end</text>
<text class="cap" x="40" y="676">at the 90° edge rotation (tick) — the octahedral 67's pair. Every rational 13 up to height 5, on any axis, lies on it (P390); nothing at n = 2 is isolated.</text>
<text class="cap" x="40" y="694">A bare end is not in the set: at a 727 arc end the count is 725, between the 727 inside and the 723 beyond — and n = 7's two ends and n = 8's upper,</text>
<text class="cap" x="40" y="712">solved in ℚ(√7809), ℚ(√601) and ℚ(√109), are open too, at 1215 and 1893. In every step measured the wall carries exactly the MEAN of the two</text>
<text class="cap" x="40" y="730">chambers it separates. Boundary points also carry MORE edge-edge coincidences than either side — 10 → 24, 144 → 162, 24 → 48 — except at a W4 wall.</text>
<text class="capb" x="40" y="762">n = 3 IS THE ONLY FINITE CASE</text>
<text class="cap" x="40" y="784">Every level set here is semialgebraic, so it has finitely many components and each is a point or a continuum: a maximiser set is finite or</text>
<text class="cap" x="40" y="804">uncountable, never countably infinite. Only n = 3 is known to take the finite option — two classes, both irrational, in ℚ(√2) and ℚ(√5).</text>
<text class="cap" x="40" y="824">Every other measured level is a continuum; n = 5 is drawn dashed because only its tangent (dimension 1) has been measured, not the set itself.</text>
<text class="cap" x="40" y="854">Current as of 2026-09-27. Dimensions: n = 4 (P378, P380), n = 6 (P306), n = 7 (P301), n = 8 (P383, P385); tangent dimensions (P381). Per-level</text>
<text class="cap" x="40" y="874">summary in words: LEVELS.md. "Drops to" and the neighbourhood counts are from the probe sweep of 2026-08-06 and were not re-measured.</text>
</svg>
