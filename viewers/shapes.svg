<text class="v" x="570" y="358" text-anchor="middle">not measured (tangent 1)</text>
<text class="k" x="570" y="371" text-anchor="middle">components</text>
<text class="v" x="570" y="385" text-anchor="middle">≥1</text>
<text class="k" x="570" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="570" y="412" text-anchor="middle">C₃</text>
<text class="k" x="570" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="570" y="439" text-anchor="middle">rational</text>
<text class="k" x="570" y="452" text-anchor="middle">drops to</text>
<text class="v" x="570" y="466" text-anchor="middle">391</text>

<!-- n = 6 : in class space, a node of TWO branches (D1, D2, 4.51 deg apart) at the record, and a
     separate arc A. Arcs B and C are D1 and D2 again under the base's C3 symmetry (P391). -->
<text class="n" x="725" y="118" text-anchor="middle">n = 6</text>
<text class="max" x="725" y="152" text-anchor="middle">727</text>
<line x1="648" y1="104" x2="648" y2="480" stroke="#dcd9d3" stroke-width="1"/>
<line x1="683" y1="236" x2="771" y2="256" stroke="#c2553a" stroke-width="4"/>
<line x1="683" y1="256" x2="771" y2="238" stroke="#c2553a" stroke-width="4" opacity=".7"/>
<circle cx="727" cy="246.5" r="6" fill="#faf9f7" stroke="#c2553a" stroke-width="3"/>
<line x1="691" y1="290" x2="759" y2="290" stroke="#c2553a" stroke-width="4"/>
<text class="k" x="725" y="222" text-anchor="middle">the node</text>
<text class="k" x="725" y="309" text-anchor="middle">arc A</text>
<line x1="661" y1="320" x2="789" y2="320" stroke="#dcd9d3" stroke-width="1"/>
<text class="k" x="725" y="344" text-anchor="middle">dimension</text>
<text class="v" x="725" y="358" text-anchor="middle">1 — two branches cross</text>
<text class="k" x="725" y="371" text-anchor="middle">components</text>
<text class="v" x="725" y="385" text-anchor="middle">≥2: node + arc A</text>
<text class="k" x="725" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="725" y="412" text-anchor="middle">trivial</text>
<text class="k" x="725" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="725" y="439" text-anchor="middle">rational + irrational</text>
<text class="k" x="725" y="452" text-anchor="middle">drops to</text>
<text class="v" x="725" y="466" text-anchor="middle">723</text>

<!-- n = 7 -->
<text class="n" x="880" y="118" text-anchor="middle">n = 7</text>
<text class="max" x="880" y="152" text-anchor="middle">1217</text>
