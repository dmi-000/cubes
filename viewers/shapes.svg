<!-- n = 3 : the only argued zero -->
<text class="n" x="260" y="118" text-anchor="middle">n = 3</text>
<text class="max" x="260" y="152" text-anchor="middle">67</text>
<line x1="183" y1="104" x2="183" y2="480" stroke="#dcd9d3" stroke-width="1"/>
