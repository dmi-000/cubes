<text class="k" x="108" y="204" text-anchor="middle">60°</text>
<text class="k" x="150" y="193" text-anchor="middle">90° edge</text>
<text class="k" x="83" y="300" text-anchor="middle">body diagonal</text>
<text class="k" x="140" y="248" text-anchor="middle">edge</text>
<line x1="41" y1="320" x2="169" y2="320" stroke="#dcd9d3" stroke-width="1"/>
<text class="k" x="105" y="344" text-anchor="middle">dimension</text>
<text class="v" x="105" y="358" text-anchor="middle">1 — one arc</text>
<text class="k" x="105" y="371" text-anchor="middle">components</text>
<text class="v" x="105" y="385" text-anchor="middle">1, two parts joined</text>
<text class="k" x="105" y="398" text-anchor="middle">symmetry</text>
<text class="v" x="105" y="412" text-anchor="middle">D₆</text>
<text class="k" x="105" y="425" text-anchor="middle">arithmetic</text>
<text class="v" x="105" y="439" text-anchor="middle">rational, dense</text>
<text class="k" x="105" y="452" text-anchor="middle">drops to</text>
