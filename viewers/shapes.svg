<rect width="1180" height="902" fill="#faf9f7"/>
<text class="ttl" x="40" y="48">The shape of the maximiser set, cube by cube</text>
<text class="sub" x="40" y="76">What the best configuration at each n looks like as a set of congruence classes · the mark carries the dimension, and whether it is established</text>

<!-- n = 2 : a punctured circle, plus the edge arc -->
<text class="n" x="105" y="118" text-anchor="middle">n = 2</text>
<text class="max" x="105" y="152" text-anchor="middle">13</text>
<!-- n = 2 : ONE arc in class space (P390): open at the identity, body-diagonal part to 60 deg,
     joined there to the edge part, which ends CLOSED at the 90 deg edge rotation -->
<path d="M 56 262 Q 80 196 108 214" fill="none" stroke="#c2553a" stroke-width="4"/>
<path d="M 108 214 Q 136 232 152 204" fill="none" stroke="#c2553a" stroke-width="4" opacity=".7"/>
<circle cx="56" cy="262" r="4.5" fill="#faf9f7" stroke="#6a7180" stroke-width="2.5"/>
<circle cx="108" cy="214" r="3.2" fill="#15181d"/>
<line x1="146.8" y1="200.0" x2="157.2" y2="208.0" stroke="#c2553a" stroke-width="3"/>
