<line x1="40" y1="514" x2="1140" y2="514" stroke="#dcd9d3" stroke-width="1"/>
<text class="capb" x="40" y="540">THE MARK IS THE DIMENSION — A HOLLOW MARK MEANS THE ZERO IS ONLY A READING, A TICK MEANS THE END IS IN THE SET</text>
<circle cx="48" cy="565" r="7" fill="#15181d"/>
<text class="lg" x="64" y="569">0-dimensional, argued</text>
<circle cx="232" cy="565" r="7" fill="#faf9f7" stroke="#15181d" stroke-width="2.5"/>
<text class="lg" x="248" y="569">reads 0 — none found</text>
<line x1="404" y1="565" x2="434" y2="565" stroke="#c2553a" stroke-width="4"/>
<text class="lg" x="442" y="569">a continuum</text>
<path d="M 546.4 571.4 A 9 9 0 1 1 546.4 558.6" fill="none" stroke="#c2553a" stroke-width="4"/>
<circle cx="548.5" cy="565" r="3" fill="#faf9f7" stroke="#6a7180" stroke-width="2"/>
<text class="lg" x="558" y="569">one that wraps</text>
<ellipse cx="678" cy="565" rx="15" ry="9" fill="#4a6fb0" opacity=".22"/>
<ellipse cx="678" cy="565" rx="15" ry="9" fill="none" stroke="#4a6fb0" stroke-width="2" stroke-dasharray="5 4"/>
<text class="lg" x="700" y="569">≥2 dimensions</text>
<line x1="812" y1="565" x2="842" y2="565" stroke="#c2553a" stroke-width="4"/>
<line x1="842" y1="558" x2="842" y2="572" stroke="#c2553a" stroke-width="3"/>
<text class="lg" x="850" y="569">its end is in the set</text>
<text class="cap" x="40" y="596">Dimension is measured in CLASS space; the 3 gauge dimensions of rotating a whole compound are quotiented out and never counted. "Drops to" is the best</text>
<text class="cap" x="40" y="616">count among 290 primitive Cayley directions at ε = 1/64, so the gap is readable by subtraction: 4, 8, 10, 2, 4, 2, 2 — and the neighbourhood is NOT one</text>
<text class="cap" x="40" y="634">value but 4, 6, 14, 14, 22 and 32 distinct counts as n runs 2 to 8. No direction preserves the count except along a tangent: every maximiser lies on walls.</text>
<text class="cap" x="40" y="658">n = 2's mark is the one exception, drawn in the Cayley chart: there the body-diagonal family wraps into a circle, but its three punctures are a single C₃ orbit,</text>
<text class="cap" x="40" y="676">so in class space it is one arc. The fainter arc beneath is the edge family, and its two ticks are the only closed ends in the table — 13 holds AT both.</text>
<text class="cap" x="40" y="694">A bare end is not in the set: at a 727 arc end the count is 725, between the 727 inside and the 723 beyond. n = 7 and n = 8's ends are quadratic</text>
<text class="cap" x="40" y="712">irrationals, untested either way, and drawn bare provisionally. Every boundary point of every kind carries MORE edge-edge coincidences than either</text>
<text class="cap" x="40" y="730">side of it: 10 → 24 at the n = 2 edge-arc ends, 144 → 162 at arc A's, 24 → 48 at the diagonal punctures. An arc ends by running into a denser stratum.</text>
<text class="capb" x="40" y="762">n = 3 IS THE ONLY FINITE CASE</text>
<text class="cap" x="40" y="784">Every level set here is semialgebraic, so it has finitely many components and each is a point or a continuum: a maximiser set is finite or</text>
<text class="cap" x="40" y="804">uncountable, never countably infinite. Only n = 3 takes the finite option — two classes, both irrational, in ℚ(√2) and ℚ(√5). The other two</text>
<text class="cap" x="40" y="824">zeros on this figure are drawn hollow for exactly that reason: they are what no search has found, not what an argument rules out.</text>
<text class="cap" x="40" y="854">Caveats carried on the figure: n = 8's ≥2 is a LOWER bound from the axis-aligned probe, which cannot see a locus in general position. n = 5's zero</text>
<text class="cap" x="40" y="874">holds only against moving ONE cube. And no method's zeros are yet trustworthy — the one that would upgrade them fails its control at the n = 6 record.</text>
</svg>
